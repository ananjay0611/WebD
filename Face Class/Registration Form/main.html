<!DOCTYPE html>
<html>
<head>
    <title>Student Registration Form</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="form-container">

        <h1>Student Registration Form</h1>

        <form>

            <div class="form-row">
                <label>Roll No.</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Student Name</label>

                <div class="name-box">
                    <input type="text" placeholder="First Name">
                    <input type="text" placeholder="Last Name">
                </div>
            </div>

            <div class="form-row">
                <label>Father's Name</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Date of Birth</label>

                <div class="dob">
                    <select>
                        <option>Day</option>
                        <option>1</option>
                        <option>2</option>
                        <option>3</option>
                        <option>4</option>
                        <option>5</option>
                    </select>

                    <select>
                        <option>Month</option>
                        <option>January</option>
                        <option>February</option>
                        <option>March</option>
                        <option>April</option>
                    </select>

                    <select>
                        <option>Year</option>
                        <option>2000</option>
                        <option>2001</option>
                        <option>2002</option>
                        <option>2003</option>
                        <option>2004</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <label>Mobile No.</label>

                <div class="mobile">
                    <select>
                        <option>+91</option>
                        <option>+1</option>
                        <option>+44</option>
                    </select>

                    <input type="tel">
                </div>
            </div>

            <div class="form-row">
                <label>Email Id</label>
                <input type="email">
            </div>

            <div class="form-row">
                <label>Password</label>
                <input type="password">
            </div>

            <div class="form-row">
                <label>Gender</label>

                <div class="radio">
                    <label>
                        <input type="radio" name="gender">
                        Male
                    </label>

                    <label>
                        <input type="radio" name="gender">
                        Female
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label>Department</label>

                <div class="radio">
                    <label>
                        <input type="radio" name="department">
                        CSE
                    </label>

                    <label>
                        <input type="radio" name="department">
                        IT
                    </label>

                    <label>
                        <input type="radio" name="department">
                        ECE
                    </label>

                    <label>
                        <input type="radio" name="department">
                        Civil
                    </label>

                    <label>
                        <input type="radio" name="department">
                        Mech
                    </label>
                </div>
            </div>

            <div class="form-row">
                <label>Course</label>

                <select>
                    <option>Select Course</option>
                    <option>B.Tech</option>
                    <option>BCA</option>
                    <option>MCA</option>
                    <option>M.Tech</option>
                </select>
            </div>

            <div class="form-row">
                <label>Student Photo</label>

                <input type="file">
            </div>

            <div class="form-row">
                <label>City</label>
                <input type="text">
            </div>

            <div class="form-row">
                <label>Address</label>
                <textarea></textarea>
            </div>

            <button type="submit">Register</button>

        </form>

    </div>

</body>
</html>
