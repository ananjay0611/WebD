<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Guess The Number</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <div class="container">

        <div class="game-box">

            <div class="top">
                <p class="small-title">NUMBER CHALLENGE</p>

                <h1>Guess The Number</h1>

                <p class="description">
                    I'm thinking of a number between
                    <strong>1 and 100</strong>
                </p>
            </div>


            <div class="number-circle">

                <span>?</span>

            </div>


            <p id="message">
                Enter your guess below
            </p>


            <div class="input-area">

                <input
                    type="number"
                    id="guessInput"
                    placeholder="00"
                    min="1"
                    max="100"
                >

                <button id="guessBtn">
                    GUESS
                </button>

            </div>


            <div class="stats">

                <div class="stat-box">

                    <span class="stat-number"
                        id="guessCount">
                        0
                    </span>

                    <span class="stat-label">
                        Attempts
                    </span>

                </div>


                <div class="stat-box">

                    <span class="stat-number"
                        id="remaining">
                        10
                    </span>

                    <span class="stat-label">
                        Remaining
                    </span>

                </div>

            </div>


            <div class="history">

                <h3>Your Guesses</h3>

                <div id="guessedNumbers"
                     class="guess-list">

                    <span class="empty">
                        No guesses yet
                    </span>

                </div>

            </div>


            <button id="restartBtn">
                ↻ PLAY AGAIN
            </button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
